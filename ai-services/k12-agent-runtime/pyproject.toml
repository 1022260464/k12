[project]
name = "k12-agent-runtime"
version = "0.1.0"
description = "FastAPI runtime for K12 agents, tools, async jobs, and sandbox artifacts"
readme = "README.md"
authors = [
    { name = "0x330", email = "1022260464@qq.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "asyncpg>=0.30.0,<1.0.0",
    "e2b-code-interpreter>=2.9.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "minio>=7.2.15,<8.0.0",
    "pydantic-settings>=2.15.0",
    "pgvector>=0.4.1,<1.0.0",
    "pymongo>=4.13.0,<5.0.0",
    "redis>=6.0.0,<8.0.0",
    "sentence-transformers>=5.1.0,<6.0.0",
    "torch>=2.11.0,<2.12.0",
    "transformers>=4.44.2,<6.0.0",
]

[project.scripts]
k12-agent-runtime = "k12_agent_runtime.main:main"
k12-agent-worker = "k12_agent_runtime.workers.rabbitmq:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.fastapi]
entrypoint = "k12_agent_runtime.interfaces.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
