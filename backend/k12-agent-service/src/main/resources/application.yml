server:
  port: 8083

spring:
  application:
    name: k12-agent-service
  datasource:
    url: jdbc:mysql://${K12_BUSINESS_DB_HOST:122.51.54.52}:${K12_BUSINESS_DB_PORT:3306}/${K12_BUSINESS_DB_NAME:k12_business}?useUnicode=true&characterEncoding=utf8&useSSL=${K12_DB_USE_SSL:false}&allowPublicKeyRetrieval=${K12_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=Asia/Shanghai
    username: ${K12_BUSINESS_DB_USERNAME:k12}
    password: ${K12_BUSINESS_DB_PASSWORD:K12@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      keepalive-time: ${K12_DB_KEEPALIVE_MS:60000}
      max-lifetime: ${K12_DB_MAX_LIFETIME_MS:300000}
      validation-timeout: ${K12_DB_VALIDATION_TIMEOUT_MS:2000}
      connection-timeout: ${K12_DB_CONNECTION_TIMEOUT_MS:10000}
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${K12_RABBITMQ_HOST:127.0.0.1}
    port: ${K12_RABBITMQ_PORT:5672}
    username: ${K12_RABBITMQ_USERNAME:k12}
    password: ${K12_RABBITMQ_PASSWORD:}
    virtual-host: ${K12_RABBITMQ_VHOST:k12}
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    openfeign:
      client:
        config:
          k12-agent-runtime:
            connect-timeout: ${K12_AGENT_RUNTIME_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${K12_AGENT_RUNTIME_READ_TIMEOUT_MS:90000}
          k12-iam-service:
            connect-timeout: ${K12_IAM_CONNECT_TIMEOUT_MS:1500}
            read-timeout: ${K12_IAM_READ_TIMEOUT_MS:2500}
          k12-learning-service:
            connect-timeout: ${K12_LEARNING_CONNECT_TIMEOUT_MS:1500}
            read-timeout: ${K12_LEARNING_READ_TIMEOUT_MS:2500}
          k12-assessment-service:
            connect-timeout: ${K12_ASSESSMENT_CONNECT_TIMEOUT_MS:1500}
            read-timeout: ${K12_ASSESSMENT_READ_TIMEOUT_MS:2500}
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.k12.platform.agent.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  health:
    # 与异步功能使用同一个开关。关闭异步模式时，不创建 RabbitMQ 健康检查连接。
    rabbit:
      enabled: ${K12_AGENT_RABBITMQ_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

k12:
  clients:
    # 本地直接使用固定端口；团队部署后可由环境变量或Nacos覆盖。
    iam-url: ${K12_IAM_SERVICE_URL:http://127.0.0.1:8081}
    learning-url: ${K12_LEARNING_SERVICE_URL:http://127.0.0.1:8082}
    assessment-url: ${K12_ASSESSMENT_SERVICE_URL:http://127.0.0.1:8084}
  agent:
    code-quota:
      # 先执行 backend/sql/mysql/k12_business_code_execution_quota.sql，再启用。
      enabled: ${K12_AGENT_CODE_QUOTA_ENABLED:false}
      daily-limit: ${K12_AGENT_CODE_DAILY_LIMIT:5}
    lifecycle:
      # 本地稍后启动 Worker 时有一小时排队时间；运行超时独立计算。
      enabled: ${K12_AGENT_LIFECYCLE_ENABLED:true}
      queue-timeout-seconds: ${K12_AGENT_QUEUE_TIMEOUT_SECONDS:3600}
      execution-timeout-seconds: ${K12_AGENT_EXECUTION_TIMEOUT_SECONDS:900}
      scan-interval-ms: ${K12_AGENT_SCAN_INTERVAL_MS:30000}
      batch-size: 100
    runtime:
      # Java 对外提供业务 API，FastAPI 只开放给 Java/RabbitMQ 的内部运行接口。
      base-url: ${K12_AGENT_RUNTIME_URL:http://127.0.0.1:8090}
      # 本地 Runtime 未配置密钥时可留空；团队环境必须与 Python 配置保持一致。
      api-key: ${K12_AGENT_INTERNAL_API_KEY:}
    rabbitmq:
      # 默认关闭，关闭时不会连接 RabbitMQ；ASYNC 请求会明确返回 503。
      enabled: ${K12_AGENT_RABBITMQ_ENABLED:false}
      exchange: ${K12_AGENT_RABBITMQ_EXCHANGE:k12.agent}
      request-queue: ${K12_AGENT_RABBITMQ_REQUEST_QUEUE:k12.agent.run.request}
      request-routing-key: ${K12_AGENT_RABBITMQ_REQUEST_ROUTING_KEY:agent.run.request}
      result-queue: ${K12_AGENT_RABBITMQ_RESULT_QUEUE:k12.agent.run.result}
      result-routing-key: ${K12_AGENT_RABBITMQ_RESULT_ROUTING_KEY:agent.run.result}
      code-request-queue: ${K12_AGENT_RABBITMQ_CODE_REQUEST_QUEUE:k12.code.execute.request}
      code-request-routing-key: ${K12_AGENT_RABBITMQ_CODE_REQUEST_ROUTING_KEY:code.execute.request}
      code-result-queue: ${K12_AGENT_RABBITMQ_CODE_RESULT_QUEUE:k12.code.execute.result}
      code-result-routing-key: ${K12_AGENT_RABBITMQ_CODE_RESULT_ROUTING_KEY:code.execute.result}
      dead-letter-exchange: ${K12_AGENT_RABBITMQ_DLX:k12.agent.dlx}
      dead-letter-queue: ${K12_AGENT_RABBITMQ_DLQ:k12.agent.run.dead}
  security:
    token-state:
      remote-enabled: ${K12_TOKEN_STATE_VALIDATION_ENABLED:true}
      endpoint: ${K12_IAM_TOKEN_STATE_URL:http://127.0.0.1:8081/api/v1/iam/auth/token-state}
    jwt:
      issuer: ${K12_JWT_ISSUER:k12-platform}
      secret: ${K12_JWT_SECRET:k12-platform-dev-secret-change-me-2026-very-long-key}
