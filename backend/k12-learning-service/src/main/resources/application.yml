server:
  port: 8082

spring:
  application:
    name: k12-learning-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: jdbc:mysql://${K12_BUSINESS_DB_HOST:122.51.54.52}:${K12_BUSINESS_DB_PORT:3306}/${K12_BUSINESS_DB_NAME:k12_business}?useUnicode=true&characterEncoding=utf8&useSSL=${K12_DB_USE_SSL:false}&allowPublicKeyRetrieval=${K12_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=Asia/Shanghai
    username: ${K12_BUSINESS_DB_USERNAME:k12}
    password: ${K12_BUSINESS_DB_PASSWORD:K12@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 公网开发连接可能被中间网络回收：空闲时每分钟校验，连接最多使用 5 分钟。
      # 这些毫秒值需小于实际网络/数据库断连阈值；生产环境应按实测调整。
      keepalive-time: ${K12_DB_KEEPALIVE_MS:60000}
      max-lifetime: ${K12_DB_MAX_LIFETIME_MS:300000}
      validation-timeout: ${K12_DB_VALIDATION_TIMEOUT_MS:2000}
      connection-timeout: ${K12_DB_CONNECTION_TIMEOUT_MS:10000}
  data:
    redis:
      host: ${K12_REDIS_HOST:127.0.0.1}
      port: ${K12_REDIS_PORT:6379}
      username: ${K12_REDIS_USERNAME:}
      password: ${K12_REDIS_PASSWORD:}
      database: ${K12_REDIS_DATABASE:0}
      connect-timeout: ${K12_REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${K12_REDIS_TIMEOUT:3s}
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.k12.platform.learning.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  health:
    # 排行榜 Redis 默认关闭；未启用时不要让可选缓存把服务健康状态判为 DOWN。
    redis:
      enabled: ${K12_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

k12:
  learning:
    rag:
      # 与 Python Runtime 使用相同的内部密钥；Java 不直接访问 pgvector。
      runtime-url: ${K12_AGENT_RUNTIME_URL:http://127.0.0.1:8090}
      api-key: ${K12_AGENT_INTERNAL_API_KEY:}
    media:
      # 数据库只保存稳定对象键，接口响应时临时生成15分钟有效的MinIO访问地址。
      # 默认关闭，因此未配置MinIO时课程查询仍可正常工作，前端会使用本地默认封面。
      enabled: ${K12_COURSE_MEDIA_ENABLED:false}
      endpoint: ${K12_MINIO_ENDPOINT:http://127.0.0.1:9000}
      # 浏览器打开封面用的地址；若本机代理访问不了 endpoint，可单独配公网/隧道地址
      public-endpoint: ${K12_MINIO_PUBLIC_ENDPOINT:${K12_MINIO_ENDPOINT:http://127.0.0.1:9000}}
      access-key: ${K12_MINIO_ACCESS_KEY:}
      secret-key: ${K12_MINIO_SECRET_KEY:}
      bucket: ${K12_MINIO_BUCKET:k12-agent-artifacts}
      url-ttl: ${K12_COURSE_MEDIA_URL_TTL:15m}
    leaderboard:
      # 关闭时直接查询MySQL；开启后Redis不可用也会自动降级到MySQL。
      redis-enabled: ${K12_REDIS_ENABLED:false}
      key: ${K12_LEADERBOARD_REDIS_KEY:k12:learning:leaderboard:v1}
      ttl: ${K12_LEADERBOARD_CACHE_TTL:60s}
      rebuild-limit: ${K12_LEADERBOARD_REBUILD_LIMIT:1000}
    cache:
      # 与排行榜共用开关：封面签名 URL、首页推荐课程、知识图谱 overview。
      redis-enabled: ${K12_REDIS_ENABLED:false}
      media-url-key-prefix: ${K12_MEDIA_URL_REDIS_KEY_PREFIX:k12:learning:media-url:v1:}
      # 必须短于 media.url-ttl，避免缓存返回已过期的 MinIO 签名。
      media-url-ttl: ${K12_MEDIA_URL_CACHE_TTL:10m}
      published-courses-key: ${K12_PUBLISHED_COURSES_REDIS_KEY:k12:learning:courses:published:v1}
      published-courses-ttl: ${K12_PUBLISHED_COURSES_CACHE_TTL:5m}
      knowledge-graph-overview-key: ${K12_KG_OVERVIEW_REDIS_KEY:k12:learning:kg:overview:v2}
      knowledge-graph-overview-ttl: ${K12_KG_OVERVIEW_CACHE_TTL:10m}
    # 知识目录 JSON：默认 classpath；可改为 file: 路径以便热更后「重新加载」
    knowledge-catalog:
      location: ${K12_KNOWLEDGE_CATALOG_LOCATION:classpath:knowledge/ai_literacy_catalog.json}
    neo4j:
      # 知识关系层；关闭时助教降级为无先修导航，不影响主链路。
      enabled: ${K12_NEO4J_ENABLED:false}
      uri: ${K12_NEO4J_URI:bolt://127.0.0.1:7687}
      username: ${K12_NEO4J_USERNAME:neo4j}
      password: ${K12_NEO4J_PASSWORD:}
      database: ${K12_NEO4J_DATABASE:neo4j}
      seed-on-startup: ${K12_NEO4J_SEED_ON_STARTUP:true}
  security:
    token-state:
      remote-enabled: ${K12_TOKEN_STATE_VALIDATION_ENABLED:true}
      endpoint: ${K12_IAM_TOKEN_STATE_URL:http://127.0.0.1:8081/api/v1/iam/auth/token-state}
    jwt:
      issuer: ${K12_JWT_ISSUER:k12-platform}
      secret: ${K12_JWT_SECRET:k12-platform-dev-secret-change-me-2026-very-long-key}
