server:
  port: 8081

spring:
  application:
    name: k12-iam-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${K12_AUTH_DB_HOST:122.51.54.52}:${K12_AUTH_DB_PORT:3306}/${K12_AUTH_DB_NAME:k12_auth}?useUnicode=true&characterEncoding=utf8&useSSL=${K12_DB_USE_SSL:false}&allowPublicKeyRetrieval=${K12_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=Asia/Shanghai
    username: ${K12_AUTH_DB_USERNAME:k12}
    password: ${K12_AUTH_DB_PASSWORD:K12@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 公网开发连接可能被中间网络回收：空闲时每分钟校验，连接最多使用 5 分钟。
      # 这些毫秒值需小于实际网络/数据库断连阈值；生产环境应按实测调整。
      keepalive-time: ${K12_DB_KEEPALIVE_MS:60000}
      max-lifetime: ${K12_DB_MAX_LIFETIME_MS:300000}
      validation-timeout: ${K12_DB_VALIDATION_TIMEOUT_MS:2000}
      connection-timeout: ${K12_DB_CONNECTION_TIMEOUT_MS:10000}
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.k12.platform.iam.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

k12:
  security:
    token-state:
      # IAM 自己使用数据库校验器，因此不能开启远程校验，否则会递归调用自己。
      remote-enabled: false
    jwt:
      issuer: ${K12_JWT_ISSUER:k12-platform}
      secret: ${K12_JWT_SECRET:k12-platform-dev-secret-change-me-2026-very-long-key}
      access-token-ttl: ${K12_JWT_ACCESS_TOKEN_TTL:30m}
  iam:
    authentication:
      max-failed-attempts: ${K12_LOGIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${K12_LOGIN_LOCK_DURATION:15m}
    behavior:
      off-topic-limit: ${K12_OFF_TOPIC_LIMIT:5}
      abnormal-behavior-limit: ${K12_ABNORMAL_BEHAVIOR_LIMIT:5}
      # 本地联调默认 2 分钟；生产设置环境变量 K12_OFF_TOPIC_TEMP_BAN_DURATION=2h
      temp-ban-duration: ${K12_OFF_TOPIC_TEMP_BAN_DURATION:2m}
    media:
      enabled: ${K12_COURSE_MEDIA_ENABLED:false}
      endpoint: ${K12_MINIO_ENDPOINT:http://127.0.0.1:9000}
      public-endpoint: ${K12_MINIO_PUBLIC_ENDPOINT:${K12_MINIO_ENDPOINT:http://127.0.0.1:9000}}
      access-key: ${K12_MINIO_ACCESS_KEY:}
      secret-key: ${K12_MINIO_SECRET_KEY:}
      # 头像桶可与课程素材分离；不存在时服务会自动创建
      bucket: ${K12_AVATAR_MINIO_BUCKET:${K12_MINIO_BUCKET:k12-user-avatars}}
      url-ttl: ${K12_AVATAR_URL_TTL:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
